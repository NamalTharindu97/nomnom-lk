name: Deploy Recruiter Demo

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full staging SHA containing the recruiter demo
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recruiter-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and deploy recruiter demo
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://demo.nomnomlk.com
    steps:
      - name: Check out staging deployment tooling
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Validate recruiter source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character Git SHA"
            exit 1
          fi
          git fetch origin staging
          git merge-base --is-ancestor 4296b4774be8a7d4e6c21304b408bcabbdadd5e7 "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/staging

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify immutable images exist
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          docker buildx imagetools inspect "docker.io/$DOCKER_USERNAME/nomnom-backend:$SOURCE_SHA"
          docker buildx imagetools inspect "docker.io/$DOCKER_USERNAME/nomnom-admin:$SOURCE_SHA"

      - name: Install SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -d "$RUNNER_TEMP/nomnom-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/nomnom-ssh/id"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/nomnom-ssh/known_hosts"

      - name: Provision isolated recruiter stack
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          trap 'rm -rf "$RUNNER_TEMP/nomnom-ssh" "$RUNNER_TEMP/recruiter-bundle"' EXIT
          port=${VPS_PORT:-22}
          install -d "$RUNNER_TEMP/recruiter-bundle"
          cp -R deploy scripts "$RUNNER_TEMP/recruiter-bundle/"
          tar -C "$RUNNER_TEMP/recruiter-bundle" -czf "$RUNNER_TEMP/recruiter-bundle.tar.gz" .
          scp -i "$RUNNER_TEMP/nomnom-ssh/id" -P "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/nomnom-ssh/known_hosts" \
            "$RUNNER_TEMP/recruiter-bundle.tar.gz" "$VPS_DEPLOY_USER@$VPS_HOST:/tmp/nomnom-recruiter-bundle.tar.gz"
          ssh -i "$RUNNER_TEMP/nomnom-ssh/id" -p "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/nomnom-ssh/known_hosts" \
            "$VPS_DEPLOY_USER@$VPS_HOST" \
            "rm -rf /tmp/nomnom-recruiter-bundle && mkdir -p /tmp/nomnom-recruiter-bundle && tar -xzf /tmp/nomnom-recruiter-bundle.tar.gz -C /tmp/nomnom-recruiter-bundle && sudo /tmp/nomnom-recruiter-bundle/scripts/vps/provision-recruiter.sh 'demo.nomnomlk.com' 'docker.io/$DOCKER_USERNAME/nomnom-backend:$SOURCE_SHA' 'docker.io/$DOCKER_USERNAME/nomnom-admin:$SOURCE_SHA'"

      - name: Verify public recruiter demo
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --output /dev/null https://demo.nomnomlk.com/login
          curl --fail --silent --show-error --output /dev/null --request POST https://demo.nomnomlk.com/api/v1/auth/browser/demo

      - name: Record deployment
        run: |
          echo "## Recruiter demo deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ inputs.source_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://demo.nomnomlk.com/login" >> "$GITHUB_STEP_SUMMARY"
