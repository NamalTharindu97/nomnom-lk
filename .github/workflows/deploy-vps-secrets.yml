name: Deploy VPS Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
      reset_admin_password:
        description: Reset the staging admin password instead of installing service secrets
        required: false
        default: false
        type: boolean
      remove_recruiter:
        description: Permanently remove the isolated recruiter stack from staging
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-vps-secrets-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Install secrets and verify services
    if: ${{ !inputs.reset_admin_password && !inputs.remove_recruiter }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out reviewed deployment scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -d "$RUNNER_TEMP/nomnom-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/nomnom-ssh/id"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/nomnom-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/nomnom-ssh/id" "$RUNNER_TEMP/nomnom-ssh/known_hosts"

      - name: Stream secrets to fixed server installer
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          POSTGRES_TLS_CERT: ${{ secrets.POSTGRES_TLS_CERT }}
          POSTGRES_TLS_KEY: ${{ secrets.POSTGRES_TLS_KEY }}
          BACKUP_R2_ACCESS_KEY: ${{ secrets.BACKUP_R2_ACCESS_KEY }}
          BACKUP_R2_SECRET_KEY: ${{ secrets.BACKUP_R2_SECRET_KEY }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
        run: |
          set -Eeuo pipefail
          trap 'rm -rf "$RUNNER_TEMP/nomnom-ssh"' EXIT
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_DEPLOY_USER:?VPS_DEPLOY_USER is required}"
          port=${VPS_PORT:-22}
          ssh_options=(
            -i "$RUNNER_TEMP/nomnom-ssh/id"
            -p "$port"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/nomnom-ssh/known_hosts"
          )
          scripts/vps/package-secrets.sh | ssh "${ssh_options[@]}" \
            "$VPS_DEPLOY_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/nomnom-install-secrets"
          ssh "${ssh_options[@]}" "$VPS_DEPLOY_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/nomnom-deploy"

  reset-admin-password:
    name: Reset staging admin password
    if: ${{ inputs.reset_admin_password && !inputs.remove_recruiter }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Require staging environment
        if: ${{ inputs.environment != 'staging' }}
        run: |
          echo "::error::Admin password reset is restricted to staging"
          exit 1

      - name: Install SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -d "$RUNNER_TEMP/nomnom-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/nomnom-ssh/id"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/nomnom-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/nomnom-ssh/id" "$RUNNER_TEMP/nomnom-ssh/known_hosts"

      - name: Reset password in staging database
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_DEPLOY_USER:?VPS_DEPLOY_USER is required}"
          if [[ ! "$ADMIN_PASSWORD_HASH" =~ ^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$ ]]; then
            echo "::error::ADMIN_PASSWORD_HASH is missing or invalid"
            exit 1
          fi
          port=${VPS_PORT:-22}
          ssh_options=(
            -i "$RUNNER_TEMP/nomnom-ssh/id"
            -p "$port"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/nomnom-ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$VPS_DEPLOY_USER@$VPS_HOST" \
            "sudo bash -s -- '$ADMIN_PASSWORD_HASH'" <<'REMOTE'
          set -Eeuo pipefail
          password_hash=$1
          set -a
          source /etc/nomnom/compose/compose.staging.env
          set +a
          postgres_container=nomnom-staging-postgres-1
          match_count=$(docker exec "$postgres_container" psql -At \
            -U "$DATABASE_USER" -d "$DATABASE_NAME" \
            -c "SELECT count(*) FROM users WHERE lower(email) = 'admin@nomnomlk.com' AND role = 'admin' AND is_active = true")
          if [[ "$match_count" != "1" ]]; then
            printf 'Expected exactly one active staging admin account, found %s\n' "$match_count" >&2
            exit 1
          fi
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 \
            -U "$DATABASE_USER" -d "$DATABASE_NAME" -v password_hash="$password_hash" <<'SQL'
          UPDATE users
          SET password_hash = :'password_hash',
              failed_login_attempts = 0,
              locked_until = NULL,
              updated_at = NOW()
          WHERE lower(email) = 'admin@nomnomlk.com'
            AND role = 'admin'
            AND is_active = true;
          SQL
          IFS='|' read -r stored_hash failed_attempts is_locked < <(
            docker exec "$postgres_container" psql -At -F '|' \
              -U "$DATABASE_USER" -d "$DATABASE_NAME" \
              -c "SELECT password_hash, failed_login_attempts, locked_until IS NOT NULL FROM users WHERE lower(email) = 'admin@nomnomlk.com' AND role = 'admin' AND is_active = true"
          )
          if [[ "$stored_hash" != "$password_hash" || "$failed_attempts" != "0" || "$is_locked" != "f" ]]; then
            printf 'Staging admin password or lockout state did not persist\n' >&2
            exit 1
          fi
          REMOTE

      - name: Verify new admin login
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          payload=$(jq -nc --arg email "admin@nomnomlk.com" --arg password "$ADMIN_PASSWORD" \
            '{email: $email, password: $password}')
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            https://api.nomnomlk.com/api/v1/auth/login)
          if [[ "$code" != "200" ]]; then
            echo "::error::Admin login verification failed with HTTP $code"
            exit 1
          fi

      - name: Revoke admin refresh tokens
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          trap 'rm -rf "$RUNNER_TEMP/nomnom-ssh"' EXIT
          port=${VPS_PORT:-22}
          ssh_options=(
            -i "$RUNNER_TEMP/nomnom-ssh/id"
            -p "$port"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/nomnom-ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$VPS_DEPLOY_USER@$VPS_HOST" "sudo bash -s" <<'REMOTE'
          set -Eeuo pipefail
          set -a
          source /etc/nomnom/compose/compose.staging.env
          set +a
          docker exec nomnom-staging-postgres-1 psql -v ON_ERROR_STOP=1 \
            -U "$DATABASE_USER" -d "$DATABASE_NAME" <<'SQL'
          DELETE FROM refresh_tokens
          WHERE user_id = (
            SELECT id FROM users
            WHERE lower(email) = 'admin@nomnomlk.com' AND role = 'admin'
          );
          SQL
          REMOTE

  remove-recruiter:
    name: Remove isolated recruiter stack
    if: ${{ inputs.remove_recruiter }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Require staging environment
        if: ${{ inputs.environment != 'staging' }}
        run: |
          echo "::error::Recruiter removal is restricted to staging"
          exit 1

      - name: Install SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -d "$RUNNER_TEMP/nomnom-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/nomnom-ssh/id"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/nomnom-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/nomnom-ssh/id" "$RUNNER_TEMP/nomnom-ssh/known_hosts"

      - name: Remove recruiter resources from VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          trap 'rm -rf "$RUNNER_TEMP/nomnom-ssh"' EXIT
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_DEPLOY_USER:?VPS_DEPLOY_USER is required}"
          port=${VPS_PORT:-22}
          ssh_options=(
            -i "$RUNNER_TEMP/nomnom-ssh/id"
            -p "$port"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/nomnom-ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$VPS_DEPLOY_USER@$VPS_HOST" "sudo bash -s" <<'REMOTE'
          set -Eeuo pipefail

          staging_dir=/etc/nomnom/compose
          staging_env="$staging_dir/compose.staging.env"
          caddyfile="$staging_dir/Caddyfile"
          caddy_container=nomnom-staging-caddy-1
          recruiter_root=/etc/nomnom-recruiter

          if [[ -f "$caddyfile" ]] && grep -q '# BEGIN NOMNOM RECRUITER' "$caddyfile"; then
            backup=$(mktemp /tmp/Caddyfile.pre-recruiter-removal.XXXXXX)
            temporary=$(mktemp "$staging_dir/.Caddyfile.XXXXXX")
            cp "$caddyfile" "$backup"
            awk '
              /# BEGIN NOMNOM RECRUITER/ { skip = 1; next }
              /# END NOMNOM RECRUITER/ { skip = 0; next }
              !skip { print }
            ' "$caddyfile" > "$temporary"
            chmod --reference="$caddyfile" "$temporary"
            chown --reference="$caddyfile" "$temporary"
            mv "$temporary" "$caddyfile"
            if ! docker exec "$caddy_container" caddy validate --config /etc/caddy/Caddyfile; then
              cp "$backup" "$caddyfile"
              rm -f "$backup"
              printf 'Caddy validation failed; recruiter route restored\n' >&2
              exit 1
            fi
            docker restart "$caddy_container" >/dev/null
            rm -f "$backup"
          fi

          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null https://api.nomnomlk.com/health && \
               curl --fail --silent --show-error --output /dev/null https://admin.nomnomlk.com/login; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error --output /dev/null https://api.nomnomlk.com/health
          curl --fail --silent --show-error --output /dev/null https://admin.nomnomlk.com/login

          if docker network inspect nomnom-recruiter-edge >/dev/null 2>&1; then
            docker network disconnect -f nomnom-recruiter-edge "$caddy_container" >/dev/null 2>&1 || true
          fi

          if [[ -f "$recruiter_root/compose/compose.recruiter.yml" && -f "$recruiter_root/compose/compose.recruiter.env" ]]; then
            docker compose \
              -f "$recruiter_root/compose/compose.recruiter.yml" \
              --env-file "$recruiter_root/compose/compose.recruiter.env" \
              down --volumes --remove-orphans
          fi
          docker network rm nomnom-recruiter-edge >/dev/null 2>&1 || true

          set -a
          source "$staging_env"
          set +a
          postgres_container=nomnom-staging-postgres-1
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 \
            -U "$DATABASE_USER" -d "$DATABASE_NAME" <<'SQL'
          DO $$
          DECLARE demo_user_id uuid;
          BEGIN
            SELECT id INTO demo_user_id
            FROM users
            WHERE lower(email) = 'recruiter-demo@nomnomlk.com'
              AND role = 'portfolio_viewer';
            IF demo_user_id IS NULL THEN
              RETURN;
            END IF;
            DELETE FROM refresh_tokens WHERE user_id = demo_user_id;
            DELETE FROM device_tokens WHERE user_id = demo_user_id;
            DELETE FROM notifications WHERE user_id = demo_user_id;
            DELETE FROM favorites WHERE user_id = demo_user_id;
            UPDATE scheduled_notifications SET user_id = NULL WHERE user_id = demo_user_id;
            DELETE FROM audit_logs WHERE admin_id = demo_user_id;
            DELETE FROM users WHERE id = demo_user_id;
          END $$;
          SQL

          r2_access_key_file=/etc/nomnom/secrets/r2_access_key
          r2_secret_key_file=/etc/nomnom/secrets/r2_secret_key
          if [[ -s "$r2_access_key_file" && -s "$r2_secret_key_file" && -n "${R2_ENDPOINT:-}" ]]; then
            aws_image=amazon/aws-cli:2.17.39
            docker run --rm \
              -e AWS_ACCESS_KEY_ID="$(<"$r2_access_key_file")" \
              -e AWS_SECRET_ACCESS_KEY="$(<"$r2_secret_key_file")" \
              -e AWS_DEFAULT_REGION=auto \
              "$aws_image" s3 rm "s3://${R2_BUCKET:-nomnom-images}/recruiter/" --recursive \
              --endpoint-url "https://$R2_ENDPOINT"
            docker image rm "$aws_image" >/dev/null 2>&1 || true
          fi

          recruiter_backend_image=$(grep -m1 '^BACKEND_IMAGE=' "$recruiter_root/compose/compose.recruiter.env" 2>/dev/null | cut -d= -f2- || true)
          recruiter_admin_image=$(grep -m1 '^ADMIN_IMAGE=' "$recruiter_root/compose/compose.recruiter.env" 2>/dev/null | cut -d= -f2- || true)
          rm -rf "$recruiter_root" /tmp/nomnom-recruiter-bundle /tmp/nomnom-recruiter-bundle.tar.gz
          rm -f /usr/local/sbin/nomnom-deploy-recruiter "$caddyfile.pre-recruiter"
          [[ -z "$recruiter_backend_image" ]] || docker image rm "$recruiter_backend_image" >/dev/null 2>&1 || true
          [[ -z "$recruiter_admin_image" ]] || docker image rm "$recruiter_admin_image" >/dev/null 2>&1 || true

          if docker ps -a --format '{{.Names}}' | grep -q '^nomnom-recruiter-'; then
            printf 'Recruiter containers remain after removal\n' >&2
            exit 1
          fi
          if docker volume ls --format '{{.Name}}' | grep -q '^nomnom-recruiter_'; then
            printf 'Recruiter volumes remain after removal\n' >&2
            exit 1
          fi
          if [[ -e "$recruiter_root" ]]; then
            printf 'Recruiter filesystem root remains after removal\n' >&2
            exit 1
          fi
          printf 'Recruiter VPS resources removed successfully\n'
          REMOTE

      - name: Verify recruiter endpoint is unavailable
        run: |
          set -Eeuo pipefail
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 15 https://demo.nomnomlk.com/login || true)
          if [[ "$code" =~ ^2 ]]; then
            echo "::error::Recruiter endpoint is still publicly available"
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null https://api.nomnomlk.com/health
          curl --fail --silent --show-error --output /dev/null https://admin.nomnomlk.com/login
