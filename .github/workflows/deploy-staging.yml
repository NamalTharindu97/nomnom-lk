name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full staging commit SHA to deploy
        required: false
        type: string
      provision_recruiter:
        description: Provision or update the isolated recruiter stack
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, publish, and deploy staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://admin.nomnomlk.com

    steps:
      - name: Resolve source SHA
        id: source
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          PINNED_SHA: ${{ vars.STAGING_DEPLOY_SHA }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          sha=${DISPATCH_SHA:-${PINNED_SHA:-$WORKFLOW_SHA}}
          if [[ -z "$sha" ]]; then
            sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/staging | cut -f1)
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character Git commit SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ -z "$DISPATCH_SHA" && -n "$PINNED_SHA" ]]; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Verify source belongs to staging
        run: |
          set -Eeuo pipefail
          git fetch origin staging
          git merge-base --is-ancestor "${{ steps.source.outputs.sha }}" origin/staging

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish backend
        if: steps.source.outputs.pinned != 'true'
        uses: docker/build-push-action@v5
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nomnom-backend:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=staging-backend
          cache-to: type=gha,mode=max,scope=staging-backend

      - name: Scan backend image
        if: steps.source.outputs.pinned != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/nomnom-backend:${{ steps.source.outputs.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Build and publish admin
        if: steps.source.outputs.pinned != 'true'
        uses: docker/build-push-action@v5
        with:
          context: admin
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            API_PROXY_TARGET=http://backend:8080
          tags: ${{ secrets.DOCKER_USERNAME }}/nomnom-admin:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=staging-admin
          cache-to: type=gha,mode=max,scope=staging-admin

      - name: Scan admin image
        if: steps.source.outputs.pinned != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/nomnom-admin:${{ steps.source.outputs.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Verify pinned images exist
        if: steps.source.outputs.pinned == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          docker buildx imagetools inspect "docker.io/$DOCKER_USERNAME/nomnom-backend:$SOURCE_SHA"
          docker buildx imagetools inspect "docker.io/$DOCKER_USERNAME/nomnom-admin:$SOURCE_SHA"

      - name: Install SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -d "$RUNNER_TEMP/nomnom-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/nomnom-ssh/id"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/nomnom-ssh/known_hosts"

      - name: Deploy immutable images to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          trap 'rm -rf "$RUNNER_TEMP/nomnom-ssh"' EXIT
          port=${VPS_PORT:-22}
          ssh -i "$RUNNER_TEMP/nomnom-ssh/id" \
            -p "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/nomnom-ssh/known_hosts" \
            "$VPS_DEPLOY_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/nomnom-deploy-staging 'docker.io/$DOCKER_USERNAME/nomnom-backend:$SOURCE_SHA' 'docker.io/$DOCKER_USERNAME/nomnom-admin:$SOURCE_SHA'"

      - name: Provision isolated recruiter stack
        if: github.event_name == 'workflow_dispatch' && inputs.provision_recruiter
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          port=${VPS_PORT:-22}
          umask 077
          install -d "$RUNNER_TEMP/nomnom-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/nomnom-ssh/id"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/nomnom-ssh/known_hosts"
          install -d "$RUNNER_TEMP/recruiter-bundle"
          cp -R deploy scripts "$RUNNER_TEMP/recruiter-bundle/"
          tar -C "$RUNNER_TEMP/recruiter-bundle" -czf "$RUNNER_TEMP/recruiter-bundle.tar.gz" .
          scp -i "$RUNNER_TEMP/nomnom-ssh/id" -P "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/nomnom-ssh/known_hosts" \
            "$RUNNER_TEMP/recruiter-bundle.tar.gz" "$VPS_DEPLOY_USER@$VPS_HOST:/tmp/nomnom-recruiter-bundle.tar.gz"
          ssh -i "$RUNNER_TEMP/nomnom-ssh/id" -p "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/nomnom-ssh/known_hosts" \
            "$VPS_DEPLOY_USER@$VPS_HOST" \
            "rm -rf /tmp/nomnom-recruiter-bundle && mkdir -p /tmp/nomnom-recruiter-bundle && tar -xzf /tmp/nomnom-recruiter-bundle.tar.gz -C /tmp/nomnom-recruiter-bundle && sudo /tmp/nomnom-recruiter-bundle/scripts/vps/provision-recruiter.sh 'demo.nomnomlk.com' 'docker.io/$DOCKER_USERNAME/nomnom-backend:$SOURCE_SHA' 'docker.io/$DOCKER_USERNAME/nomnom-admin:$SOURCE_SHA'"

      - name: Verify public endpoints
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error https://api.nomnomlk.com/health
          curl --fail --silent --show-error --output /dev/null https://admin.nomnomlk.com/login

      - name: Record deployment
        run: |
          echo "## Staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://api.nomnomlk.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- Admin: https://admin.nomnomlk.com" >> "$GITHUB_STEP_SUMMARY"
