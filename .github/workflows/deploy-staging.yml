name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full staging commit SHA to deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  ship-and-deploy:
    name: Ship prebuilt images and deploy staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://admin.nomnomlk.com

    steps:
      - name: Resolve source SHA
        id: source
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          sha=${DISPATCH_SHA:-$WORKFLOW_SHA}
          if [[ -z "$sha" ]]; then
            sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/staging | cut -f1)
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character Git commit SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Verify source belongs to staging
        run: |
          set -Eeuo pipefail
          git fetch origin staging
          git merge-base --is-ancestor "${{ steps.source.outputs.sha }}" origin/staging

      - name: Check for prebuilt images
        id: prebuilt
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          missing=0
          for img in "$DOCKER_USERNAME/nomnom-backend:$SHA" "$DOCKER_USERNAME/nomnom-admin:$SHA"; do
            if docker manifest inspect "$img" >/dev/null 2>&1; then
              echo "Found $img"
            else
              echo "Missing $img"
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.prebuilt.outputs.missing == '1'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.prebuilt.outputs.missing == '1'
        uses: docker/setup-buildx-action@v3

      - name: Build and publish backend image (fallback)
        if: steps.prebuilt.outputs.missing == '1'
        uses: docker/build-push-action@v5
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nomnom-backend:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=staging-backend
          cache-to: type=gha,mode=max,scope=staging-backend

      - name: Scan backend image (fallback)
        if: steps.prebuilt.outputs.missing == '1'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/nomnom-backend:${{ steps.source.outputs.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Build and publish admin image (fallback)
        if: steps.prebuilt.outputs.missing == '1'
        uses: docker/build-push-action@v5
        with:
          context: admin
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            API_PROXY_TARGET=http://backend:8080
          tags: ${{ secrets.DOCKER_USERNAME }}/nomnom-admin:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=staging-admin
          cache-to: type=gha,mode=max,scope=staging-admin

      - name: Scan admin image (fallback)
        if: steps.prebuilt.outputs.missing == '1'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/nomnom-admin:${{ steps.source.outputs.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Install SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -d "$RUNNER_TEMP/nomnom-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/nomnom-ssh/id"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/nomnom-ssh/known_hosts"

      - name: Deploy immutable images to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          trap 'rm -rf "$RUNNER_TEMP/nomnom-ssh"' EXIT
          port=${VPS_PORT:-22}
          ssh -i "$RUNNER_TEMP/nomnom-ssh/id" \
            -p "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/nomnom-ssh/known_hosts" \
            "$VPS_DEPLOY_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/nomnom-deploy-staging 'docker.io/$DOCKER_USERNAME/nomnom-backend:$SOURCE_SHA' 'docker.io/$DOCKER_USERNAME/nomnom-admin:$SOURCE_SHA'"

      - name: Smoke test
        env:
          ADMIN_EMAIL: admin@nomnomlk.com
          ADMIN_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error https://api.nomnomlk.com/health >/dev/null
          echo "API /health OK"
          curl --fail --silent --show-error https://api.nomnomlk.com/api/v1/banners/active >/dev/null
          echo "Public banners OK"
          payload=$(jq -nc --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email: $email, password: $password}')
          curl --fail --silent --show-error -c "$RUNNER_TEMP/nomnom-cookies" \
            -H 'Content-Type: application/json' --data "$payload" \
            https://admin.nomnomlk.com/api/v1/auth/browser/login >/dev/null
          echo "Admin browser login OK"
          curl --fail --silent --show-error -b "$RUNNER_TEMP/nomnom-cookies" \
            https://admin.nomnomlk.com/api/v1/dashboard/stats >/dev/null
          echo "Authenticated dashboard OK"
          curl --fail --silent --show-error --output /dev/null https://admin.nomnomlk.com/login
          echo "Smoke test passed"

      - name: Record deployment
        run: |
          {
            echo "## Staging deployment"
            echo "- Commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- API: https://api.nomnomlk.com"
            echo "- Admin: https://admin.nomnomlk.com"
          } >> "$GITHUB_STEP_SUMMARY"
